// Spielserver-Anbindung ohne Minecraft: Sitzung, Tagestakt, Speichern im Hintergrund und Befehlslogik.
// civ-fabric übersetzt nur noch zwischen Minecraft und diesem Modul; alles hier ist ohne Spiel testbar.
plugins {
    id 'civ.java-conventions'
    id 'java-library'
}

dependencies {
    api project(':civ-application')
    implementation project(':civ-persistence')
}
