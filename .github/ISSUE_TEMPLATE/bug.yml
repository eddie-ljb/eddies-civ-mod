name: Fehler melden
description: Etwas funktioniert nicht wie dokumentiert
labels: [bug]
title: "[Bug] "
body:
  - type: textarea
    id: desc
    attributes: { label: Beschreibung }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Schritte zum Nachstellen }
  - type: input
    id: version
    attributes: { label: Mod-Version }
  - type: textarea
    id: log
    attributes: { label: Log / Fehlermeldung, render: shell }
