# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          wrapper-directory: .
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: |
          attempt=1
          max_attempts=3
          until ./gradlew build; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::Build failed after $max_attempts attempts"
              exit 1
            fi
            wait_seconds=$((attempt * 20))
            echo "::warning::Build attempt $attempt failed (often a transient dependency-resolution hiccup against maven.fabricmc.net), retrying in ${wait_seconds}s"
            sleep "$wait_seconds"
            attempt=$((attempt + 1))
          done
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: civ-fabric/build/libs/
