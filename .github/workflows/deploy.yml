name: release

# Ein Tag wie v0.1.0 oder v0.1.0-beta baut den Mod, legt das GitHub-Release an und veröffentlicht
# dieselbe Version auf Modrinth. Alles in einem Workflow, weil ein mit GITHUB_TOKEN angelegtes
# Release keine weiteren Workflows (on: release) auslöst.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
          cache: 'gradle'
      - run: chmod +x ./gradlew

      - name: Version aus dem Tag ableiten
        id: meta
        run: |
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Alles mit Bindestrich (0.2.0-beta, 0.2.0-rc1) gilt als Vorabversion
          if [[ "$VERSION" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            if [[ "${VERSION,,}" == *alpha* ]]; then echo "type=alpha" >> "$GITHUB_OUTPUT"; else echo "type=beta" >> "$GITHUB_OUTPUT"; fi
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "type=release" >> "$GITHUB_OUTPUT"
          fi

      - name: Bauen
        run: ./gradlew build -Pversion=${{ steps.meta.outputs.version }}

      - name: GitHub-Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: |
            civ-fabric/build/libs/eddies-civ-mod-*.jar
            !civ-fabric/build/libs/*-sources.jar

      - name: Changelog aus dem GitHub-Release holen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release view "$TAG" --json body --jq .body > CHANGELOG_RELEASE.md

      - name: Auf Modrinth veröffentlichen
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}

          # Nur das fertige Mod-JAR; die Module (civ-domain usw.) stecken per include darin
          files: |
            civ-fabric/build/libs/!(*-@(sources|dev|javadoc)).jar

          name: Eddies Civ Mod ${{ steps.meta.outputs.version }}
          version: ${{ steps.meta.outputs.version }}
          version-type: ${{ steps.meta.outputs.type }}
          changelog-file: CHANGELOG_RELEASE.md

          loaders: |
            fabric
          game-versions: |
            26.3
          java: |
            25
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}
