name: Deploy Fabric Mod to Modrinth

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Mod with Gradle
        run: ./gradlew build

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: ${{ secrets.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          
          # Filtert Sourcen und Dev-Jars heraus
          files: |
            build/libs/!(-sources|-dev|*-shadow).jar
          
          # Metadaten aus dem GitHub-Release übernehmen
          version-title: "${{ github.event.release.name }}"
          version-number: "${{ github.event.release.tag_name }}"
          changelog: "${{ github.event.release.body }}"
          
          # Setzt den Typ auf 'beta', wenn es ein GitHub Pre-Release ist, sonst auf 'release'
          version-type: ${{ github.event.release.prerelease && 'beta' || 'release' }}
          
          # Spezifische Einstellungen für Fabric und Minecraft 26.3
          loaders: |
            fabric
          game-versions: |
            26.3
