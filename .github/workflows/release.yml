name: release
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build -Pversion=${GITHUB_REF_NAME#v}
      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            civ-fabric/build/libs/eddies-civ-mod-*.jar
            !civ-fabric/build/libs/*-sources.jar
          generate_release_notes: true