// Entwicklungswerkzeug: simuliert den Kern ohne Minecraft. Gehört nicht ins Mod-JAR.
plugins {
    id 'civ.java-conventions'
    id 'application'
}

dependencies {
    implementation project(':civ-application')
    implementation project(':civ-persistence')
}

application {
    mainClass = 'de.etiennebader.civ.sim.SimulationMain'
}

tasks.named('run', JavaExec) {
    // Relative Pfade wie --out beziehen sich auf das Wurzelverzeichnis des Projekts.
    workingDir = rootProject.projectDir
}
