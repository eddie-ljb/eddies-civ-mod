# Standardwerte aller Szenarien. Ein Szenario überschreibt nur, was es ändern will.
# Beträge sind in der kleinsten Währungseinheit angegeben (1 Smaragd = 100 Einheiten).

seed=42
days=1000

# Bevölkerung
population.players=10
population.villagers=40

# Welt: Gemeinden werden zufällig in diesem Radius um den Ursprung gegründet (in Chunks).
world.radius.chunks=48

# Wirtschaft
# Startvermögen je Akteur, gleichverteilt zwischen 0 und diesem Wert.
economy.starting.wealth.max=60000
economy.income.per.day=2000
# Produktivität streut gleichverteilt in [1 - spread, 1 + spread].
economy.income.spread=0.5
economy.living.cost.per.day=1600
# Rücklage, ab der sich ein Akteur sicher fühlt (skaliert mit seiner Sparsamkeit).
economy.savings.target=40000
# Startkapital, das ein Gründer in die neue Gemeindekasse einzahlt.
economy.founding.capital=20000
# Höchster Anteil des Vermögens, den ein bargeldaffiner Akteur als Bargeld hält.
economy.cash.share=0.3

# Grundstücke (Kantenlänge in Blöcken, höchstens 16)
land.plot.size.min=6
land.plot.size.max=12
land.plot.price.per.block=60
# So viele freie Wohngrundstücke hält eine Gemeinde zusätzlich zur Nachfrage bereit.
land.plot.reserve=1

# Gebiet
territory.claim.base=2
territory.claim.per.member=1
territory.require.adjacency=true
# Ab dieser Mitgliederzahl erlaubt eine Gemeinde per Gesetz Außenposten.
territory.outpost.member.threshold=6
territory.max.outposts=2
# Wahrscheinlichkeit pro Tag und Gemeinde, einen leeren Außenposten wieder aufzugeben.
territory.outpost.release.chance.per.day=0.01

# Verwaltung der Gemeinden
governance.tax.review.interval.days=7
# Höchster Grundsteuersatz pro Block und Tag.
governance.tax.max.rate=8
governance.treasury.reserve.per.member=10000
# Unterhalt, den eine Gemeinde pro Chunk und Tag aus ihrer Kasse zahlt.
governance.upkeep.per.chunk.per.day=300
governance.embassy.chance.per.day=0.002

# Verhalten der Akteure
behavior.decision.noise=0.05
behavior.belonging.growth.per.day=0.04
behavior.housing.growth.per.day=0.06
# Unterhalb dieser Zufriedenheit denkt ein Mitglied über den Austritt nach.
behavior.leave.threshold=0.2
# Anteil des Einkommens, den ein Akteur als Grundsteuer klaglos zahlt.
behavior.tax.tolerance=0.25
